<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G0A{L}</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="playground">
        <div class="goal-wrapper">
            
            // randomly populate the obstacle at different places
            
            <svg id="goal-post" viewBox="0 0 296 360" xmlns="http://www.w3.org/2000/svg" aria-label="goal post">
                <defs>
                    <pattern id="net-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
                        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
                    </pattern>
                    <linearGradient id="post-finish" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="40%" stop-color="#f5f5f5"/>
                        <stop offset="100%" stop-color="#d8d8d8"/>
                    </linearGradient>
                </defs>

                <!-- Depth/Net Plane -->
                <path d="M 60 70 L 285 85 L 285 295 L 60 310 Z" fill="url(#net-pattern)" stroke="rgba(255,255,255,0.2)" />
                <!-- Entry Point -->
                <!-- <path d="M 60 70 L 60 310 L 30 320 L 30 60 Z" fill="rgba(255,255,255,0.08)" /> -->

                <!-- Bottom side block -->
                <rect x="60" y="300" width="220" height="20" fill="#c0c0c0" rx="2" />
                
                <!-- Back vertical bar -->
                <rect x="275" y="85" width="10" height="210" fill="#b0b0b0" rx="1" />

                <!-- Front-left side -->
                <rect x="60" y="50" width="220" height="20" rx="3" fill="#e8e8e8" />
            </svg>

            <div id="goal-hitboxes">
                <div class="pole bottom-block" id="bottom-block"></div>
                <div class="pole pole-right" id="pole-right"></div>
                <div class="crossbar" id="crossbar"></div>
                <div class="goal-entry" id="goal-entry"></div>
            </div>
            <div id="goal-flash"></div>
            <div id="goal-particles"></div>
        </div>

        <div class="hud" aria-live="polite">
            <div class="goal-counter" id="goal-counter">
                <span class="goal-counter__label">Goals</span>
                <span class="goal-counter__value" id="score-value">0</span>
            </div>
        </div>

        <svg id="sling-svg">
            <line id="sling-line" stroke="white" stroke-width="3" opacity="0.6"/>
        </svg>
        <img src="./image/ball.png" alt="ball" id="ball">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Draggable.min.js" integrity="sha512-dgqdovLK5r/NMiV5YfWA0xC94DKGrm+6q1OZpuWHm+uBGLTck6wu58WAX9lmy8wec6cVnsgxbPJ60DtmNFnfgg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>
</html>
